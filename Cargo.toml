[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/trading-core",
    "crates/engine-runtime",
    "crates/control-gateway",
    "apps/simulator",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/ayushmishra2005/rust-low-latency-trading-lab"

[workspace.dependencies]
protocol = { path = "crates/protocol" }
trading-core = { path = "crates/trading-core" }
engine-runtime = { path = "crates/engine-runtime" }

blake3 = "1"
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
criterion = "0.5"
crossbeam-queue = "0.3"
crossbeam-utils = "0.8"
hdrhistogram = "7"
proptest = "1"
rtrb = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slab = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync"] }
