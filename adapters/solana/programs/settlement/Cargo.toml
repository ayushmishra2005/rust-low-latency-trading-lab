[package]
name = "settlement"
version = "0.1.0"
description = "Collateral and batch settlement program for the trading lab"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "settlement"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]


[dependencies]
anchor-lang = "0.31.1"
anchor-spl = "0.31.1"
# Solana 2.1 platform-tools ship Cargo 1.79, which cannot parse edition 2024
# crates. These pins stay on the newest releases that crate still accepts.
blake3 = { version = "=1.8.2", optional = true }
zeroize = { version = "=1.8.2", optional = true }
zeroize_derive = { version = "=1.4.3", optional = true }
proc-macro-crate = { version = "=3.3.0", optional = true }
indexmap = { version = "=2.11.4", optional = true }
unicode-segmentation = { version = "=1.12.0", optional = true }

