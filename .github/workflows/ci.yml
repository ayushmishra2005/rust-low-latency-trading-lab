name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      - name: Replay determinism against the golden fixtures
        run: |
          cargo run --release -p simulator -- verify --input fixtures/feeds/seed1-500.feed
          cargo run --release -p simulator -- verify --input fixtures/feeds/seed2-500-faults.feed

  fuzz-targets:
    name: Fuzz targets build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - run: cargo fuzz build --dev

  control-api:
    name: Control API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/control-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/control-api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Venue integration tests skip themselves without a local validator or ledger.
      - run: npm test

  solana:
    name: Solana program
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: adapters/solana
      - name: Install the Solana and Anchor toolchains
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v2.1.11/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          cargo install --git https://github.com/coral-xyz/anchor avm --locked
          avm install 0.31.1
          avm use 0.31.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: adapters/solana/package-lock.json
      - name: Test against a local validator
        working-directory: adapters/solana
        run: |
          solana-keygen new --no-bip39-passphrase --silent --force
          npm ci
          anchor test

  canton:
    name: Canton workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install the Daml SDK
        run: |
          curl -sSL https://get.daml.com | sh -s 2.10.6
          echo "$HOME/.daml/bin" >> "$GITHUB_PATH"
      - name: Build and test the settlement model
        working-directory: adapters/canton
        run: |
          daml build
          daml test
